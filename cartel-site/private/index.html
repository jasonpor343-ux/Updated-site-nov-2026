<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0a0a0a;--line:#232323;--text:#fff;--mute:#8c8c8c;--accent:#fff;--sel:#161616;--play:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:14px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:800 28px Unbounded,sans-serif;letter-spacing:-.02em;margin-right:16px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.right button{background:none;border:0;padding:10px 20px;border-radius:10px;color:var(--mute);font-weight:500;font-size:17px;border-bottom:2px solid transparent}
nav button:hover,.right button:hover{color:var(--text)}
nav button[aria-current=page]{background:#161616;color:var(--text);border-bottom-color:var(--accent)}
.right{margin-left:auto;display:flex;align-items:center;gap:6px}
.avatar{width:42px;height:42px;border-radius:50%;background:#1a1a1a center/cover no-repeat;margin:0 4px 0 10px}
.user{font-weight:600;margin-right:12px}
.right .out{border:1px solid #2e2e2e;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:32px;max-width:1400px;margin:36px auto;padding:0 32px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px;align-self:start}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.head h2{margin:0;font:600 22px Inter,sans-serif}
.head span{color:var(--mute);font-size:14px}
.search{width:100%;margin:16px 0 14px;background:transparent;border:1px solid #2e2e2e;border-radius:12px;padding:13px 16px;color:var(--text);font:inherit}
.search::placeholder{color:#7b7f8c}
.sec-btn{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 8px;text-align:left;font-weight:600;font-size:17px}
.num{font:800 13px Unbounded,sans-serif;color:var(--accent);min-width:22px}
.sec-btn .count{margin-left:auto;color:var(--mute);font-weight:400;font-size:15px}
.sec-btn .chev{color:var(--mute);width:14px;text-align:center;transition:transform .2s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed ul{display:none}
ul{list-style:none;margin:0 0 6px;padding:0}
.lec{width:100%;display:flex;align-items:center;gap:12px;background:none;border:1px solid transparent;border-radius:12px;padding:12px 10px;text-align:left;color:#d9dbe3}
.lec:hover{background:#121212}
.lec .t{flex:1}
.lec .d{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.lec[aria-current=true]{background:var(--sel);border-color:var(--accent);color:#fff}
.empty{color:var(--mute);padding:12px 8px;font-size:15px}
.player{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:16/9;border:1px solid var(--line)}
.player svg{position:absolute;inset:0;width:100%;height:100%}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--play);border:0;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.playbig svg{position:static;width:34px;height:34px;margin-left:5px}
.playing .playbig{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(transparent,rgba(7,8,11,.88))}
.bar button{background:none;border:0;padding:4px;display:grid;place-items:center}

.prog{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;cursor:pointer;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--play);border-radius:3px;width:0}

h1{font:800 clamp(30px,4vw,48px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;margin:30px 0 8px}

[hidden]{display:none!important}
@media(max-width:900px){main{grid-template-columns:1fr;padding:0 16px}header{padding:12px 16px}.right{margin-left:0;width:100%}.user{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.vbox{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--panel);border:1px dashed #2e2e2e;display:grid;place-items:center;color:var(--mute);text-align:center}
.vbox iframe,.vbox video{width:100%;height:100%;border:0;background:#000}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;text-align:left}

.in{background:transparent;border:1px solid #2e2e2e;border-radius:10px;padding:11px 14px;color:var(--text);font:inherit;min-width:220px}

.chip.pending{background:#2a2a2a;color:#ddd}.chip.approved{background:#fff;color:#000}.chip.rejected{background:#1a1a1a;color:#fff;outline:1px dashed #777}

.file a{color:var(--text)}
.x{background:none;border:0;font-size:22px;color:var(--mute);line-height:1}

.other.wide{max-width:900px;text-align:left}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.cal-h h3{margin:0;font:600 20px Inter,sans-serif}
.cal-nav{display:flex;gap:8px}
.cal-nav button{background:none;border:1px solid #2e2e2e;border-radius:10px;width:40px;height:40px;font-size:18px}
.cal-nav button:disabled{opacity:.3;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{color:var(--mute);font-size:13px;text-align:center;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;position:relative}
.cal button:hover:not(:disabled){border-color:#777}
.cal button:disabled{opacity:.25;cursor:not-allowed}
.cal button.full{opacity:.5}
.cal button.today{border-color:#888}
.cal button.sel{background:#fff;color:#000;border-color:#fff;font-weight:700}
.cal .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}

.slot small{display:block;color:var(--mute)}
.slot:hover:not(:disabled){border-color:#777}
.slot:disabled{opacity:.5;cursor:not-allowed}
.slot.pick{background:#fff;color:#000}.slot.pick small{color:#444}
.slot.mine{border-color:#fff;opacity:1}
.blist{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.brow .grow{flex:1}.brow small{color:var(--mute);display:block}
.other h2{font:600 22px Inter,sans-serif;margin:30px 0 4px}
.sec-btn .num{font-size:18px;min-width:32px;line-height:1}
.lec .num{font-size:12px;color:var(--mute)}
.recap{margin:18px 0 34px}.recap .vbox{margin-bottom:12px}
.recap h3{margin:0 0 4px;font:600 22px Inter,sans-serif}
.recap small{color:var(--mute)}
.recap p{margin:10px 0;white-space:pre-wrap;color:#d9dbe3}
.col{display:flex;flex-direction:column;gap:10px}
.col .in{width:100%}
.vbox{position:relative}
.vwrap{margin-bottom:6px}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;animation:wmdrift 18s ease-in-out infinite alternate}
.wm .wr{position:absolute;left:-20%;width:140%;display:flex;justify-content:space-around;white-space:nowrap;transform:rotate(-18deg)}
.wm span{display:inline-block;font:400 clamp(10px,1.5vw,15px) Inter,sans-serif;color:rgba(140,140,140,.2);letter-spacing:.03em}
.wm span.hot{transform:rotate(18deg);font-weight:700;color:rgba(38,38,38,.92);text-shadow:0 0 2px rgba(255,255,255,.3)}

.vbox:fullscreen{aspect-ratio:auto;border-radius:0;background:#000;border:0}

.fmts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fmts span{font-size:11px;letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.other .row.fsrow{justify-content:flex-start}
.other .fsrow .btn{padding:6px 14px;font-size:13px;border-radius:8px}
.pagetitle{margin-bottom:28px}

<script>
// If the sign-in has expired (for example after the site restarted), go back to the connect screen.
(function(){const f=window.fetch.bind(window);window.fetch=function(){return f.apply(null,arguments).then(function(r){
  if(r&&(r.status===401||r.status===503)){r.clone().json().catch(function(){return null}).then(function(j){location.href="/"+(j&&j.reason==="otherdevice"?"?error=otherdevice":"")})}
  return r})}})();
const DATA=[
 {name:"Induction",items:[{t:"Introduction",video:"",hw:"Introduce yourself: your trading experience, what you want from the course and your biggest challenge right now."},{t:"Truth of The Markets",video:"",hw:"Elaborate on what you found important in this class and why it is important not to be mixed in with the retail traders of the market."}]},
 {name:"Candle Anatomy",items:[{id:"amd-basics",t:"AMD Fundamentals",video:"",hw:"Mark 5 different accumulations, manipulations and distributions on the chart."},{t:"Liquidity Sweeps",video:"",hw:"Mark out 10 different liquidity sweeps on the chart."},{t:"Orderblocks",video:"",hw:"Mark 5 different orderblocks and 10 examples of SMTs and POIs."},{t:"Bias",video:"",hw:"Provide one example of a day and explain why price moved from point to point."},{t:"Weekly Candle",video:"",hw:"Mark 5 different weeks of price action, explaining how each day moved to form the weekly candle."}]},
 {name:"Entries",items:[{t:"Entry Criterias",video:"",hw:"Mark out 10 different entries following the criteria."},{t:"Cartel Continuations",video:"",hw:"Find 5 different examples of entries that follow the Cartel Continuations chain."},{t:"SMT Divergence",video:"",hw:"Mark 5 different SMTs on the chart."}]},
 {name:"Masterclass",items:[{id:"position-sizing",t:"Masterclass V1",video:"",hw:"Summarise the three most important lessons from Masterclass V1 and how you will apply them."}]},
];
const flat=[];let idx=0;
DATA.forEach((s,si)=>s.items.forEach((it,ii)=>flat.push({...it,si,ii,idx:idx++,id:it.id||it.t.toLowerCase().replace(/[^a-z0-9]+/g,"-"),sec:s.name})));
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={};
S.subs=S.subs||{};S.discord=null;S.owner=false;
const uid=()=>(window.ME&&window.ME.id)||"guest";
const save=()=>{try{localStorage.setItem("cartel-state-"+uid(),JSON.stringify(S))}catch(e){}};
const hk=id=>"cartel-hw-"+uid()+"-"+id;
// Progress is stored per Discord account. Data saved before this change is claimed by the first account that signs in.
function loadS(){
  const u=uid(),k="cartel-state-"+u;let raw=null;
  try{raw=localStorage.getItem(k)}catch(e){}
  if(!raw){try{const old=localStorage.getItem("kilo-state");if(old){raw=old;localStorage.setItem(k,old);localStorage.removeItem("kilo-state");flat.forEach(f=>{const o=localStorage.getItem("cartel-hw-"+f.id);if(o){localStorage.setItem("cartel-hw-"+u+"-"+f.id,o);localStorage.removeItem("cartel-hw-"+f.id)}})}}catch(e){}}
  try{S=JSON.parse(raw)||{}}catch(e){S={}}
  S.subs=S.subs||{};S.discord=null;S.owner=false;
}
const sub=id=>S.subs[id]||(S.subs[id]={notes:"",hw:"",status:"draft",fb:""});
const dOK=()=>!!(window.ME&&window.ME.member);
const unlocked=f=>S.owner||(dOK()&&(f.idx===0||sub(flat[f.idx-1].id).status==="approved"));
let cur=flat.find(f=>unlocked(f)&&sub(f.id).status!=="approved")||flat[0];
const closed=new Set();let view="lectures";

function renderList(){
  const q="",box=$("list");box.innerHTML="";let n=0;
  DATA.forEach((s,si)=>{
    const items=flat.filter(f=>f.si===si&&(!q||f.t.toLowerCase().includes(q)));
    if(!items.length)return;n+=items.length;
    const w=document.createElement("div");w.className="sec"+(closed.has(si)&&!q?" closed":"");
    w.innerHTML='<button class="sec-btn" aria-expanded="'+!w.classList.contains("closed")+'"><span class="num">0'+(si+1)+'</span><span>'+s.name+'</span><span class="count">'+items.length+'</span><span class="chev">&#9662;</span></button><ul></ul>';
    w.querySelector(".sec-btn").onclick=()=>{closed.has(si)?closed.delete(si):closed.add(si);renderList()};
    items.forEach(f=>{
      const ok=unlocked(f),st=sub(f.id).status,li=document.createElement("li");
      li.innerHTML='<button class="lec"'+(ok?'':' disabled')+(f.id===cur.id?' aria-current="true"':'')+'><span class="num">0'+(f.ii+1)+'</span><span class="t">'+f.t+'</span><span class="d">'+(!ok?'Locked':st==="approved"?'Done':st==="pending"?'In review':st==="rejected"?'Changes':'')+'</span></button>';
      li.firstChild.onclick=()=>{cur=f;renderList();renderLec()};
      w.querySelector("ul").appendChild(li);
    });
    box.appendChild(w);
  });
  if(!n)box.innerHTML='<p class="empty">No lectures match &ldquo;'+""+'&rdquo;. Try a different name.</p>';
  $("count").textContent=n+(n===1?" video":" videos");
}

function videoHTML(f){
  const u=LV[f.id]||f.video;
  if(!u)return '<div class="vbox"><p>No video has been added to this lecture yet.</p></div>';
  return playerHTML(u);

  return '<div class="card" style="margin-top:12px"><h3>Lecture video link</h3><p class="saved">Only you see this box. Paste a YouTube, Vimeo or .mp4 link starting with https://. Members see the video straight away.</p><div class="row"><input class="in" id="lvurl" style="flex:1" placeholder="https://..." value="'+esc(LV[f.id]||"")+'"><button class="btn" data-act="lvsave">Save</button>'+(LV[f.id]?'<button class="btn ghost" data-act="lvdel">Remove</button>':'')+'</div><p class="saved" id="lvmsg" role="status"></p></div>';
}
addEventListener("pagehide",()=>{try{navigator.sendBeacon("/api/leaving")}catch(e){}});
addEventListener("pageshow",e=>{if(e.persisted)location.reload()});

const rvSeen={};
function reportView(id){const n=Date.now();if(rvSeen[id]&&n-rvSeen[id]<60000)return;rvSeen[id]=n;fetch("/api/video-view",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}).catch(()=>{})}
async function syncProgress(){
  let p;try{const r=await fetch("/api/my-progress");if(!r.ok)return{list:false,cur:false};p=await r.json()}catch(e){return{list:false,cur:false}}
  const snap=()=>flat.map(f=>sub(f.id).status+":"+sub(f.id).fb).join("|"),curSnap=()=>cur.id+":"+sub(cur.id).status+":"+sub(cur.id).fb+":"+unlocked(cur);
  const a=snap(),c=curSnap();
  flat.forEach(f=>{const r=sub(f.id),x=p[f.id];r.status=x?x.status:"draft";r.fb=x?x.fb:""});
  save();
  return{list:a!==snap(),cur:c!==curSnap()};
}
async function submitWork(btn){
  const f=cur,r=sub(f.id),say=t=>{if($("filemsg"))$("filemsg").textContent=t};
  btn.disabled=true;say("Sending your work…");
  try{
    const res=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lecture:f.id,title:f.t,notes:r.notes,hw:(f.id==="introduction"||f.id==="position-sizing"||f.id==="truth-of-the-markets")?r.hw:"",files:f.id==="introduction"?[]:hwf(f.id)})});
    if(res.status===413){btn.disabled=false;say("Your files are too large to send. Remove some and try again.");return}
    const j=await res.json();
    if(j.ok){r.status="pending";r.fb="";save();renderList();renderLec()}
    else{btn.disabled=false;say(j.error||"Could not submit.")}
  }catch(e){btn.disabled=false;say("Could not reach the server.")}
}
let RV=[],RVc=0,rvmsg="",rvopen=null,rvdet=null;
function updRev(){$("membtn").hidden=!S.owner;$("revbtn").hidden=!S.owner;$("revbtn").textContent="Review"+(S.owner&&RVc?" ("+RVc+")":"")}
async function loadReviews(){
  try{const r=await fetch("/api/reviews");RV=r.ok?await r.json():[];rvmsg=r.ok?"":"Could not load submissions."}catch(e){RV=[];rvmsg="Could not load submissions."}
  RVc=RV.filter(x=>x.status==="pending").length;updRev();
}
const rr2=()=>{if(view==="review")$("other").innerHTML=reviewHTML()};
function detailHTML(x){
  if(!rvdet)return '<p class="saved" style="margin-top:12px">Loading…</p>';
  const isImg=f=>/^image\//.test(f.type||"");
  return '<div style="margin-top:14px"><b>Notes and homework</b><p style="white-space:pre-wrap;margin:6px 0 14px">'+esc(rvdet.notes)+'</p>'
  +(rvdet.files.length?'<b>Attached files</b><div class="files">'+rvdet.files.map(f=>'<div class="file">'+(isImg(f)?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer"><img src="'+esc(f.url)+'" alt="" style="width:120px;height:80px"></a>':'')+'<a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">'+esc(f.name)+'</a></div>').join("")+'</div>':'')
  +(x.status==="pending"?'<textarea class="in" id="rvfb" rows="2" maxlength="300" style="width:100%;margin-top:14px" placeholder="Feedback for the member (required if you ask for changes)"></textarea><div class="row" style="margin-top:10px"><button class="btn" data-act="rapprove" data-u="'+x.uid+'" data-l="'+esc(x.lec)+'">Approve</button><button class="btn ghost" data-act="rreject" data-u="'+x.uid+'" data-l="'+esc(x.lec)+'">Request changes</button></div>':(x.fb?'<p class="saved" style="margin-top:12px">Feedback sent: '+esc(x.fb)+'</p>':''))+'</div>';
}
function reviewHTML(){
  const when=t=>new Date(t).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
  const row=x=>'<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">'+esc(x.title)+'</h3><p class="saved" style="margin:4px 0 0">'+esc(x.name)+' (@'+esc(x.username)+') · '+when(x.at)+'</p></div><span class="chip '+x.status+'">'+{pending:"Waiting for review",approved:"Approved",rejected:"Changes requested"}[x.status]+'</span></div>'+(rvopen===x.uid+":"+x.lec?detailHTML(x):'<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="rview" data-u="'+x.uid+'" data-l="'+esc(x.lec)+'">View work</button></div>')+'</div>';
  const P=RV.filter(x=>x.status==="pending");
  return '<h1>Review</h1>'+(rvmsg?'<p class="saved" role="status">'+esc(rvmsg)+'</p>':'')+'<h2>Waiting for review ('+P.length+')</h2>'+(P.length?P.map(row).join(""):'<p class="saved">Nothing is waiting for review.</p>');
}
async function reviewCall(action,u,l){
  const fb=$("rvfb")?$("rvfb").value:"";
  try{const j=await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid:u,lec:l,action,fb})}).then(r=>r.json());
    if(j.ok){rvopen=null;rvmsg=""}else rvmsg=j.error||"Something went wrong."}catch(e){rvmsg="Could not reach the server."}
  await loadReviews();rr2();
}
setInterval(async()=>{
  const r=await syncProgress();
  if(view==="lectures"){if(r.list)renderList();if(r.cur)renderLec()}
  if(S.owner){await loadReviews();if(view==="review"&&!rvopen)rr2()}
},30000);

let MB=[],MBroster=true,mbfilter="all",mbq="",mbmsg="";
async function loadMembers(){try{const r=await fetch("/api/members");if(!r.ok){MB=[];mbmsg="Could not load members.";return}const d=await r.json();MB=d.members||[];MBroster=!!d.roster;mbmsg=""}catch(e){MB=[];mbmsg="Could not load members."}}
const mr=()=>{if(view==="members")$("other").innerHTML=membersHTML()};
function mbInfo(m){
  const ap=new Set(m.approved),cur=flat.find(f=>!ap.has(f.id)),done=flat.filter(f=>ap.has(f.id)).length;
  const st=!cur?"complete":m.pending.indexOf(cur.id)>=0?"pending":m.rejected.indexOf(cur.id)>=0?"rejected":"todo";
  const days=m.last?Math.floor((Date.now()-m.last)/864e5):null,started=(m.approved.length+m.pending.length+m.rejected.length)>0;
  return{done,cur,st,days,started,quiet:st!=="complete"&&m.last>0&&days>=14};
}
function mbTable(){
  const q=mbq.trim().toLowerCase();
  let L=MB.map(m=>({m,i:mbInfo(m)})).filter(x=>!q||(x.m.name+" "+x.m.username).toLowerCase().indexOf(q)>=0);
  L=L.filter(x=>mbfilter==="all"||(mbfilter==="review"&&x.m.pending.length>0)||(mbfilter==="quiet"&&x.i.quiet)||(mbfilter==="notstarted"&&!x.i.started)||(mbfilter==="done"&&x.i.st==="complete"));
  L.sort((a,b)=>(b.m.pending.length>0)-(a.m.pending.length>0)||(b.m.last-a.m.last));
  if(!L.length)return '<p class="saved">No members match.</p>';
  const date=t=>new Date(t).toLocaleDateString("en-AU",{day:"numeric",month:"short"});
  const row=({m,i})=>{
    const lab=i.st==="complete"?"Course complete":i.st==="pending"?"In review":i.st==="rejected"?"Changes requested":i.started?"Up next":"Not started";
    const cls=i.st==="pending"?"pending":i.st==="rejected"?"rejected":i.st==="complete"?"approved":"";
    return '<tr><td><b>'+esc(m.name)+'</b><small>@'+esc(m.username)+'</small></td>'
    +'<td><div class="pbar"><i style="width:'+Math.round(i.done/flat.length*100)+'%"></i></div><small>'+i.done+' of '+flat.length+' approved</small></td>'
    +'<td>'+(i.cur?esc(i.cur.t):'All lectures')+'<small><span class="chip '+cls+'">'+lab+'</span></small></td>'
    +'<td>'+(m.last?date(m.last)+'<small>'+(i.days===0?"Today":i.days+" day"+(i.days===1?"":"s")+" ago")+(i.quiet?" · quiet":"")+'</small>':'<small>Nothing submitted</small>')+'</td>'
    +'<td>'+(m.next?fmtDay(m.next.date)+'<small>'+slotLabel(m.next.time)+'</small>':'<small>None booked</small>')+'</td></tr>';
  };
  return '<div class="mwrap"><table class="mtable"><thead><tr><th>Member</th><th>Progress</th><th>Current lecture</th><th>Last submitted</th><th>Next 1-1</th></tr></thead><tbody>'+L.map(row).join("")+'</tbody></table></div>';
}
function membersHTML(){
  const waiting=MB.filter(m=>m.pending.length>0).length;
  const F=[["all","All"],["review","Waiting for review"],["quiet","Quiet 14+ days"],["notstarted","Not started"],["done","Completed"]];
  return '<h1>Members</h1><p style="color:var(--mute);margin:0">'+MB.length+' member'+(MB.length===1?'':'s')+(waiting?' · '+waiting+' waiting for review':'')+'</p>'
  +(MBroster?'':'<p class="saved" style="margin:8px 0 0">Showing members who have submitted work. To also list members who haven\u2019t started, turn on Server Members Intent for your bot in the Discord developer portal.</p>')
  +(mbmsg?'<p class="saved" role="status">'+esc(mbmsg)+'</p>':'')
  +'<div class="row" style="margin:18px 0 14px;justify-content:flex-start"><input class="in" id="mbq" placeholder="Search by name or handle" value="'+esc(mbq)+'" style="min-width:260px">'+F.map(f=>'<button class="btn '+(mbfilter===f[0]?'':'ghost')+'" data-act="mbf" data-f="'+f[0]+'" style="padding:7px 14px;font-size:13.5px">'+f[1]+'</button>').join("")+'</div><div id="mbtable">'+mbTable()+'</div>';
}
document.addEventListener("input",e=>{if(e.target&&e.target.id==="mbq"){mbq=e.target.value;$("mbtable").innerHTML=mbTable()}});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="bnote")bnote=e.target.value});
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v&&v.dataset.view==="signout"){fetch("/api/logout",{method:"POST"}).finally(()=>{location.href="/"});return}if(v){show(v.dataset.view);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  if(a==="rmfile"){const fl=hwf(cur.id);fl.splice(+b.dataset.i,1);try{localStorage.setItem(hk(cur.id),JSON.stringify(fl))}catch(x){}renderLec()}else if(a==="goprofile")show("profile");
  else if(a==="lvsave")lvCall(cleanLink($("lvurl").value));
  else if(a==="lvdel")lvCall("");
  else if(a==="fs"){const v=b.closest(".vwrap").querySelector(".vbox");try{(v.requestFullscreen||v.webkitRequestFullscreen).call(v)}catch(x){}}
  else if(a==="rpost")recapCall("/api/recaps",{title:$("rtitle").value,url:cleanLink($("rurl").value),desc:$("rdesc").value},"Posted.");
  else if(a==="rdel"){if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Click again to delete";setTimeout(()=>{b.dataset.armed="";b.textContent="Delete"},3000);return}recapCall("/api/recaps/delete",{id:b.dataset.id},"Deleted.")}
  else if(a==="bprev"||a==="bnext"){bm.m+=a==="bnext"?1:-1;if(bm.m<0){bm.m=11;bm.y--}if(bm.m>11){bm.m=0;bm.y++}rb()}
  else if(a==="bday"){bsel=b.dataset.d;bpick="";bmsg="";rb()}
  else if(a==="bpick"){bpick=b.dataset.t;rb()}
  else if(a==="bconfirm"){if(!bnote.trim()){bmsg="Please say what the 1-1 is for.";rb();return}bookCall("/api/book",{date:bsel,time:bpick,note:bnote.trim()},"Booked. See you then.")}
  else if(a==="bcancel")bookCall("/api/cancel",{date:b.dataset.d,time:b.dataset.t},"Booking cancelled.");
  else if(a==="mtoggle"){fetch("/api/maintenance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on:!(window.ME&&window.ME.maintenance)})}).then(r=>r.json()).then(j=>{if(j.ok){window.ME.maintenance=j.on;show("profile")}}).catch(()=>{})}
  else if(a==="mbf"){mbfilter=b.dataset.f;mr()}
  else if(a==="submit")submitWork(b);
  else if(a==="rview"){rvopen=b.dataset.u+":"+b.dataset.l;rvdet=null;rr2();fetch("/api/reviews/detail?uid="+encodeURIComponent(b.dataset.u)+"&lec="+encodeURIComponent(b.dataset.l)).then(r=>r.ok?r.json():{notes:"Could not load this submission.",files:[]}).then(d=>{rvdet=d;rr2()}).catch(()=>{rvdet={notes:"Could not load this submission.",files:[]};rr2()})}
  else if(a==="rapprove")reviewCall("approve",b.dataset.u,b.dataset.l);
  else if(a==="rreject")reviewCall("reject",b.dataset.u,b.dataset.l);
  else if(a==="verify"){const n=$("dname").value.trim();if(!n){$("dname").focus();return}b.disabled=true;$("verr").textContent="";fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:n})}).then(r=>r.json()).then(j=>{if(j.ok){window.ME=j.me;S.owner=!!j.me.owner;cur=flat.find(f=>unlocked(f)&&sub(f.id).status!=="approved")||flat[0];refresh()}else{b.disabled=false;$("verr").textContent=j.error||"Could not verify."}}).catch(()=>{b.disabled=false;$("verr").textContent="Could not reach the server."})}
  else if(a==="ownoff"){S.owner=false;refresh()}
});
fetch("/api/me").then(r=>r.ok?r.json():null).catch(()=>null).then(async m=>{window.ME=m;loadS();S.owner=!!(m&&m.owner);await loadLV();await syncProgress();if(S.owner)await loadReviews();cur=flat.find(f=>unlocked(f)&&sub(f.id).status!=="approved")||flat[0];refresh()});
</script>
