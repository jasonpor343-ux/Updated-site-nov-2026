<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cartel</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px;text-align:center}
main{width:100%;max-width:360px}
.logo{font:800 40px Unbounded,sans-serif;letter-spacing:-.02em;margin:0 0 26px}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 22px}
.rule i{width:56px;height:1px;background:#333}
.rule b{width:5px;height:5px;background:#fff}
h1{font:500 12px Inter,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8c8c8c;margin:0 0 22px}
p{font-size:15px;line-height:1.7;color:#a8a8a8;margin:0 0 28px}
.foot{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#666}
</style>
<script>
(function(){
  var ua=navigator.userAgent,tp=navigator.maxTouchPoints||0,
  m=/Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|BlackBerry|Opera Mini|IEMobile|webOS|Windows Phone/i.test(ua)||(navigator.userAgentData&&navigator.userAgentData.mobile===true)||((/Macintosh/.test(ua)||(/Linux/.test(ua)&&!/CrOS/.test(ua)))&&tp>1);
  if(!m&&location.search.indexOf("preview")<0)location.replace("/");
})();
</script>
</head>
<body><main>
<div class="logo">cartel</div>
<div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
<h1>Computer required</h1>
<p>This site can only be accessed on a computer or laptop. Please open it on a desktop or laptop and try again.</p>
<div class="foot">Mobile and tablet devices are not supported</div>
</main></body></html>
