<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cartel</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--text:#fff;--mute:#8c8c8c;--line:#2e2e2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px}
main{width:100%;max-width:420px;text-align:center}
.logo{font:800 44px Unbounded,sans-serif;letter-spacing:-.02em;margin:0 0 28px}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--mute);margin:0 0 22px}
input{width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);font:inherit;margin-bottom:12px}
.btn{display:block;width:100%;background:#fff;color:#000;border-radius:12px;padding:14px;font:600 16px Inter,sans-serif;text-decoration:none}
button{width:100%;background:#fff;color:#000;border:0;border-radius:12px;padding:14px;font:600 16px Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1}
main::before{content:"";position:absolute;inset:-90px -60px;background:radial-gradient(closest-side,rgba(0,0,0,.88),rgba(0,0,0,0));z-index:-1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo,h1,main>p,.btn{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
h1{animation-delay:.15s}main>p{animation-delay:.25s}.btn{animation-delay:.35s}
@media(prefers-reduced-motion:reduce){.logo,h1,main>p,.btn{animation:none}}
.who{display:flex;align-items:center;gap:14px;justify-content:center;margin:0 0 20px;font-size:16px}
.who img{border-radius:50%;background:#1a1a1a}
.alt{background:none;color:#666;width:auto;padding:0;margin-top:20px;font:500 11px Inter,sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none}
.alt:hover{color:#999}
.who b{font-weight:500;letter-spacing:.02em}
#confirm>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){#confirm>*{animation:none}}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 22px}
.rule i{width:56px;height:1px;background:#333}
.rule b{width:5px;height:5px;background:#fff}
#connect h1,#confirm h1{font:500 12px Inter,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin:0 0 26px}
#connect p,#confirm p{font-size:15px;line-height:1.7;color:#a8a8a8;max-width:300px;margin:0 auto 30px}
.foot{margin-top:18px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#666}
.rule,#connect p,.foot{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.rule{animation-delay:.1s}#connect p{animation-delay:.25s}.foot{animation-delay:.45s}
@media(prefers-reduced-motion:reduce){.rule,#connect p,.foot{animation:none}}
#err{color:#fff;min-height:24px;margin:14px 0 0}
</style><script>
(function(){
  var ua=navigator.userAgent,tp=navigator.maxTouchPoints||0,
  m=/Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|BlackBerry|Opera Mini|IEMobile|webOS|Windows Phone/i.test(ua)||(navigator.userAgentData&&navigator.userAgentData.mobile===true)||((/Macintosh/.test(ua)||(/Linux/.test(ua)&&!/CrOS/.test(ua)))&&tp>1);
  if(m&&location.pathname!=="/device.html")location.replace("/device.html");
})();
</script>
</head>
<body><canvas id="bg" aria-hidden="true"></canvas><main>
<div class="logo">cartel</div>
<div id="connect"><div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
<h1>Private Trading Mentorship</h1>
<p>Access is granted by invitation.</p>
<a class="btn" href="/auth/discord">Connect Discord</a>
<div class="foot">By invitation only</div></div>
<div id="confirm" hidden>
<div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
<h1>Authorise to verify</h1>
<div class="who"><img id="av" alt="" width="56" height="56"><b id="nm"></b></div>
<p>Clicking the button below verifies whether you have access to the site.</p>
<button id="ok">Verify</button>
<button class="alt" id="other">Use a different account</button>
</div>
<div id="err" role="status"></div>
</main>
<script>
const M={notmember:"You are not in the Cartel server. Join it, then connect again.",norole:"You are in the server but do not have the required role.",expired:"Your sign-in expired. Try again.",failed:"Discord sign-in failed. Try again."};
const e=new URLSearchParams(location.search).get("error");
if(e)document.getElementById("err").textContent=M[e]||M.failed;
function startBg(c){
  const x=c.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w,h,dots=[],raf,mx=-999,my=-999;
  function size(){const r=devicePixelRatio||1;w=c.clientWidth;h=c.clientHeight;c.width=w*r;c.height=h*r;x.setTransform(r,0,0,r,0,0);const n=Math.round(Math.min(90,w*h/16000));dots=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4}))}
  function draw(){
    x.clearRect(0,0,w,h);
    for(const d of dots){if(!reduce){d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>w)d.vx*=-1;if(d.y<0||d.y>h)d.vy*=-1}x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.arc(d.x,d.y,d.r,0,6.283);x.fill()}
    for(let i=0;i<dots.length;i++)for(let j=i+1;j<dots.length;j++){const a=dots[i],b=dots[j],dx=a.x-b.x,dy=a.y-b.y,q=dx*dx+dy*dy;if(q<14400){x.strokeStyle="rgba(255,255,255,"+(.18*(1-q/14400))+")";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    for(const d of dots){const dx=d.x-mx,dy=d.y-my,q=dx*dx+dy*dy;if(q<22500){x.strokeStyle="rgba(255,255,255,"+(.35*(1-q/22500))+")";x.beginPath();x.moveTo(d.x,d.y);x.lineTo(mx,my);x.stroke()}}
    if(!reduce)raf=requestAnimationFrame(draw);
  }
  size();draw();
  addEventListener("resize",()=>{size();if(reduce)draw()});
  addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY});
  document.addEventListener("visibilitychange",()=>{if(reduce)return;cancelAnimationFrame(raf);if(!document.hidden)draw()});
}
startBg(document.getElementById("bg"));
(async()=>{
  const p=await fetch("/api/pending").then(r=>r.ok?r.json():null).catch(()=>null);
  if(!p)return;
  document.getElementById("connect").hidden=true;document.getElementById("confirm").hidden=false;
  document.getElementById("av").src=p.avatar;document.getElementById("nm").textContent=p.name;
  const ok=document.getElementById("ok");
  ok.onclick=async()=>{
    ok.disabled=true;err.textContent="";
    try{const j=await fetch("/auth/confirm",{method:"POST"}).then(r=>r.json());
      if(j.ok)location.reload();else{err.textContent=j.error;ok.disabled=false}}
    catch(e){err.textContent="Could not reach the server.";ok.disabled=false}
  };
  document.getElementById("other").onclick=async()=>{await fetch("/auth/cancel",{method:"POST"}).catch(()=>{});location.href="/"};
})();
</script></body></html>
